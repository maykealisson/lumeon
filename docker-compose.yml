services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-fundament-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # MySQL do liberty exposto na máquina (porta 3306); valores vêm do .env
      - MYSQL_HOST=${MYSQL_HOST_DOCKER:-host.docker.internal}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-fundament}
    volumes:
      - .:/app
    command: python -m uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
